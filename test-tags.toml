# Shared test-case tag vocabulary. nucloud stamps this file into every test repo.
# Rules: docs/testing/tags.md#rules (nucloud) and docs/nucloud.md (each repo).
#
# Each tag is <group>:<name>, lowercase kebab-case; a name may hold a further
# :<part> (cloud:manipulator:pod). Gherkin writes every ":" as "." and pytest as "_". `default` is the selection
# default: "include" runs with a plain `make test`; "exclude" runs only when
# TAGS= names the tag. `absent_on` lists stages that do not run the service the
# tag needs; a run on such a stage excludes the tag unless TAGS= names it. `source` is who may set it: "author" (a person or the
# suite's source), "classifier" (repo code that derives it from the case), or
# "measured" (TESTMASTER timing only; never written by hand).
# A repo adds its own tags in test-tags.local.toml under the prefix
# [repo] prefix = "<name>", for example hsm:f4-coverage.

schema = 1

[groups]
lifecycle = "Whether the case should run at all"
risk      = "Security or safety concerns about the case itself"
kind      = "What the case proves"
cloud     = "What the case does to the cloud it runs against"
needs     = "Credentials, services or hardware the case requires"
tier      = "Measured duration class"
suite     = "A named selection the upstream suite defines (smoke, sanity)"
api       = "Route family the case called, measured from its suite log (api:devices)"
service   = "Cloud service behind those routes (service:iam)"
fixture   = "Fixture the case uses, named as in nucloud docs/fixture (fixture:hsm)"
feature   = "Product area the case's source file covers (feature:cloud-vault-jwt)"

[open]  # groups whose names are measured per case, not listed here; source "classifier"
groups = ["api", "service", "fixture", "feature"]

[retired]  # tags no case carries; a case that lost one needs no "# removed" note in test-tags.lock
"cloud:writes" = "split into cloud:apiwrites and cloud:manipulator:*"

[tags."lifecycle:deprecated"]
default = "exclude"
source  = "classifier"
means   = "Covers behavior the product no longer supports; kept for history"
aliases = ["deprecated"]

[tags."lifecycle:disabled"]
default = "exclude"
source  = "author"
means   = "Turned off upstream; never runs without TAGS=lifecycle:disabled"
aliases = ["disable", "ignore", "pytest.mark.skip"]

[tags."lifecycle:open-bug"]
default = "exclude"
source  = "author"
means   = "Fails because of a known, filed product defect"
aliases = ["open_bug"]

[tags."lifecycle:quarantined"]
default = "exclude"
source  = "classifier"
means   = "Flaky or unverified; held out until its result is reproducible"

[tags."lifecycle:flaky"]
default = "include"
source  = "classifier"
means   = "Its verdict changed between two back-to-back runs; still runs, held for the flake detector"
aliases = ["flaky"]

[tags."lifecycle:retired:ported"]
default = "include"
source  = "author"
means   = "Ran only on a retired Jenkins or git host; ported unchanged into this repo's suite"

[tags."risk:insecure"]
default = "exclude"
source  = "classifier"
means   = "Exercises a configuration known to be insecure, such as RSA exponent F0"
aliases = ["F0-is-insecure"]

[tags."kind:negative"]
default = "include"
source  = "author"
means   = "Expects the cloud to refuse a request"

[tags."kind:rejection"]
default = "include"
source  = "author"
means   = "Proves a specific insecure or invalid input is rejected"
aliases = ["f0-rejection"]

[tags."kind:control"]
default = "include"
source  = "author"
means   = "Checks the test harness, not the product"

[tags."cloud:read-only"]
default = "include"
source  = "author"
means   = "Makes only GET and OPTIONS requests; safe on staging"
aliases = ["read-only", "readonly", "pytest.mark.readonly"]

[tags."cloud:apiwrites"]
default = "include"
source  = "classifier"
means   = "Creates, changes or deletes cloud state through the cloud's API; refused on read-only stages"
aliases = ["cloud:writes", "cloud.writes", "cloud_writes"]  # retired name, accepted in TAGS= and EXCLUDE_TAGS=

[tags."cloud:manipulator:pod"]
default = "include"
source  = "classifier"
means   = "Reaches into a cloud pod: kubectl exec, cp or port-forward, or the Kubernetes pod exec API"

[tags."cloud:manipulator:kubectl"]
default = "include"
source  = "classifier"
means   = "Runs kubectl or the Kubernetes client against a cloud cluster"

[tags."cloud:manipulator:ssh"]
default = "include"
source  = "classifier"
means   = "Logs in to a cloud host over SSH"

[tags."cloud:manipulator:db"]
default = "include"
source  = "classifier"
means   = "Connects straight to a cloud database"

[tags."cloud:login"]
default = "include"
source  = "author"
means   = "Logs in with a user and password (a POST); refused on read-only stages"
aliases = ["login"]

[tags."cloud:production-only"]
default = "exclude"
source  = "author"
means   = "Written for a production cloud; never runs on a k3s stage by default"
aliases = ["production", "pytest.mark.production"]

[tags."needs:hsm"]
default = "include"
source  = "classifier"
means   = "Needs the DB-HSM service and its signing-key fact"

[tags."needs:admin"]
default = "include"
source  = "classifier"
means   = "Needs an administrator account on the cloud"

[tags."needs:device"]
default = "include"
source  = "author"
means   = "Needs hardware or an Edge gateway a run cannot create; a case that starts a simulated or process device does not"

[tags."needs:local-service"]
default = "include"
source  = "classifier"
means   = "Runs against the repository's own service, started in the test container; calls no stage, so its verdict is the same on every stage (pairs with needs:offline)"

[tags."needs:update-service"]
default = "include"
source  = "classifier"
means   = "Calls the update services (firmware catalog, firmware images, update campaigns)"
absent_on = ["staging"]

[tags."needs:cloud-ui"]
default = "include"
source  = "classifier"
means   = "Calls cloud-ui-server (/wigwag, not the edge bridge's /wigwag/api)"
absent_on = ["staging"]

[tags."needs:device-insights"]
default = "include"
source  = "classifier"
means   = "Calls Device Insights v3preview1 (insights-sessions, incidents, custom-metrics); staging routes it for tier 99 keys only, k3s-golden answers 404"
absent_on = ["k3s-golden"]

[tags."needs:enrollment-bulk"]
default = "include"
source  = "classifier"
means   = "Uploads an enrollment CSV (device-enrollments-bulk-uploads or -deletes); staging's enrollment service has no object store (minio-cluster), so the upload fails there"
absent_on = ["staging"]

[tags."needs:edge-services"]
default = "include"
source  = "classifier"
means   = "Resolves or calls the stage's Edge cloud hosts (edge-k8s, gateways, containers); k3s-golden hosts none until k3s-goldedge is up"
absent_on = ["k3s-golden"]

[tags."needs:admin-allowlist"]
default = "include"
source  = "classifier"
means   = "Calls /admin/v3 from the suite host's egress; staging's source-address allowlist refuses echo (136.62.143.210) with 403 (izuma-dm-platform request 20261113T064043Z)"
absent_on = ["staging"]

[tags."needs:billing-report"]
default = "include"
source  = "classifier"
means   = "Reads last month's billing report for its account; no staging account has one (401 tier 99, 403 tier 2 and 0, 404 tier 1)"
absent_on = ["staging"]

[tags."needs:kaas"]
default = "include"
source  = "classifier"
means   = "Needs Edge KaaS (edge-k8s); staging runs myriplane instead (docs/testing/cloud-defects.md, Out of scope)"
absent_on = ["staging"]

[tags."needs:edge"]
default = "include"
source  = "classifier"
means   = "Needs an Edge gateway registered to the stage; k3s-golden has none until k3s-goldedge is up"
absent_on = ["k3s-golden"]

[tags."needs:factory-tool-download"]
default = "include"
source  = "classifier"
means   = "Calls /downloads/fcu; factory-tool-download is deployed on neither stage (docs/testing/cloud-defects.md, Out of scope)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:rcc"]
default = "include"
source  = "classifier"
means   = "Needs an RCC receiver; no stage has one or will (izuma-dm-platform ruling)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:dba-sda"]
default = "include"
source  = "classifier"
means   = "Calls trust-anchors or ace-auth (DBA/SDA); deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:wms"]
default = "include"
source  = "classifier"
means   = "Calls WMS pdm-workflow-definitions; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:manufacturing-statistics"]
default = "include"
source  = "classifier"
means   = "Calls manufacturing/statistics; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:connectivity-inventory"]
default = "include"
source  = "classifier"
means   = "Calls connectivity-management inventory; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:account-manage"]
default = "include"
source  = "classifier"
means   = "Calls accounts/<id>/manage; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:heartbeat"]
default = "include"
source  = "classifier"
means   = "Calls a service heartbeat route; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:hsm-internal"]
default = "include"
source  = "classifier"
means   = "Calls the HSM internal or dev APIs (sign_csr, csrs-with-keys, hsm-delete); deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:mqtt-websocket"]
default = "include"
source  = "classifier"
means   = "Uses the MQTT-over-websocket broker; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:sla-service"]
default = "include"
source  = "classifier"
means   = "Calls the SLA service; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:serviceprobe-ports"]
default = "include"
source  = "classifier"
means   = "Probes service ports 30666 or 8082; deployed on neither stage (izuma-dm-platform 20261113T033551Z)"
absent_on = ["staging", "k3s-golden"]

[tags."needs:lab"]
default = "exclude"
source  = "author"
means   = "Needs lab hardware or networks this workspace does not reach"
aliases = ["intlab"]

[tags."needs:offline"]
default = "include"
source  = "author"
means   = "Runs without any cloud"
aliases = ["offline"]

[tags."tier:fast"]
default = "include"
source  = "measured"
means   = "Measured average 10 seconds or less"

[tags."tier:standard"]
default = "include"
source  = "measured"
means   = "Measured average over 10 seconds, up to 120 seconds"

[tags."tier:slow"]
default = "include"
source  = "measured"
means   = "Measured average over 120 seconds, up to 30 minutes"

[tags."tier:long"]
default = "include"
source  = "measured"
means   = "Measured average over 30 minutes"

[tags."tier:unmeasured"]
default = "include"
source  = "measured"
means   = "No completed measured run yet"

[tags."suite:smoke"]
default = "include"
source  = "author"
means   = "In the upstream suite's smoke selection"
aliases = ["smoke", "ww_smoke", "edge_smoke", "ww_api_smoke"]

[tags."suite:sanity"]
default = "include"
source  = "author"
means   = "In the upstream suite's sanity selection"
aliases = ["sanity"]
